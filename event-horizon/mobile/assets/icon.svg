<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3a1a06"/><stop offset=".55" stop-color="#120802"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" x2="1">
      <stop offset="0" stop-color="#ffd9a3"/><stop offset=".35" stop-color="#f3953f"/><stop offset=".7" stop-color="#b8461a"/><stop offset="1" stop-color="#5a1a06"/>
    </linearGradient>
    <linearGradient id="back" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe6bf"/><stop offset=".5" stop-color="#e98a3a"/><stop offset="1" stop-color="#7a2a0c"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="#000"/>
  <circle cx="512" cy="512" r="460" fill="url(#glow)"/>
  <!-- far side of the disk, lensed over the shadow -->
  <path d="M262 512 A250 250 0 0 1 762 512 L712 512 A200 200 0 0 0 312 512 Z" fill="url(#back)" opacity=".85" filter="url(#blur)"/>
  <!-- photon ring -->
  <circle cx="512" cy="512" r="196" fill="none" stroke="#ffe7c2" stroke-width="10" filter="url(#blur)"/>
  <circle cx="512" cy="512" r="196" fill="none" stroke="#fff3df" stroke-width="5"/>
  <circle cx="512" cy="512" r="190" fill="#000"/>
  <!-- front of the disk -->
  <ellipse cx="512" cy="530" rx="430" ry="70" fill="url(#disk)" filter="url(#blur)"/>
  <ellipse cx="512" cy="530" rx="420" ry="58" fill="url(#disk)"/>
  <path d="M322 530 A190 40 0 0 0 702 530 A190 26 0 0 1 322 530Z" fill="#000" opacity=".0"/>
</svg>
