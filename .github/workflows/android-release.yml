# Signed Android App Bundle (.aab) for Google Play.
# Run it: GitHub → Actions → "Android release (Google Play)" → Run workflow.
# Download: the run → Artifacts → event-horizon-aab → upload app-release.aab to Play Console.
#
# Needs 4 repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   ANDROID_KEYSTORE_BASE64   the upload key file (.jks) as base64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android release (Google Play)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown in the store, e.g. 1.0.1"
        required: true
        default: "1.0.0"

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-horizon/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build && npx cap sync android
        env:
          EH_API: ${{ vars.EH_API }}
      - name: Restore upload key
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then echo "::error::Add the ANDROID_* secrets first (see the top of this file)"; exit 1; fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        working-directory: event-horizon/mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: chmod +x gradlew && ./gradlew bundleRelease
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: event-horizon-aab
          path: event-horizon/mobile/android/app/build/outputs/bundle/release/app-release.aab
