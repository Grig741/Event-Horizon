# Builds the Event Horizon Android app (debug APK) on every push that touches the app or the site.
# Download: GitHub → Actions → latest run → Artifacts → event-horizon-apk.
# Set the site address once: Settings → Secrets and variables → Actions → Variables → EH_API = https://<site>.netlify.app
name: Android APK

on:
  push:
    branches: [main]
    paths: ["event-horizon/web/**", "event-horizon/mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-horizon/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build && npx cap sync android
        env:
          EH_API: ${{ vars.EH_API }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: event-horizon/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: event-horizon-apk
          path: event-horizon/mobile/android/app/build/outputs/apk/debug/app-debug.apk
